<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6f3eb" />
    <title>Murmur</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app" aria-label="Word game">
      <section class="game-panel" aria-label="Game board">
        <div class="top-row">
          <button id="progress-toggle" class="progress-button" type="button">
            <span id="progress-percent">0%</span>
            <span class="button-caption">found</span>
          </button>
          <button id="new-game" class="plain-button" type="button">New</button>
        </div>

        <div id="current-word" class="current-word" aria-live="polite" aria-label="Current word"></div>
        <div id="letter-buttons" class="letter-grid" aria-label="Available letters"></div>

        <div class="controls">
          <button id="delete-letter" class="plain-button" type="button">Delete</button>
          <button id="submit-word" class="submit-button" type="button">Submit</button>
        </div>

        <p id="message" class="message" role="status" aria-live="polite"></p>

        <button id="found-toggle" class="found-summary" type="button">
          <span id="found-count">0 words</span>
          <span class="button-caption">view all</span>
        </button>
        <ol id="recent-words" class="recent-words" aria-label="Recent found words" role="button" tabindex="0"></ol>
      </section>
    </main>

    <dialog id="progress-dialog" class="modal">
      <div class="modal-card">
        <div class="modal-header">
          <h2>Progress</h2>
          <button class="modal-close" type="button" data-close-modal aria-label="Close progress">Close</button>
        </div>
        <div id="progress-details" class="progress-details"></div>
      </div>
    </dialog>

    <dialog id="found-dialog" class="modal">
      <div class="modal-card">
        <div class="modal-header">
          <h2>Found Words</h2>
          <button class="modal-close" type="button" data-close-modal aria-label="Close found words">Close</button>
        </div>
        <ol id="found-words" class="found-words"></ol>
      </div>
    </dialog>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
