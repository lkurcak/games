<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#030303" />
    <title>Wizard's Dungeon</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <main class="app" aria-label="Wizard's Dungeon game">
      <section class="game-shell">
        <div id="stats" class="stats" aria-live="polite"></div>

        <div class="board-slot">
          <div class="board-panel">
            <div id="status" class="status" aria-live="polite">Loading WASM...</div>
            <canvas id="game-canvas" aria-label="Game board"></canvas>
            <div id="game-over" class="game-over hidden" role="status" aria-live="polite">
              <strong>Game Over</strong>
              <span id="game-over-summary"></span>
              <button id="game-over-restart" type="button">Restart</button>
            </div>
          </div>
        </div>

        <div id="abilities" class="abilities" aria-label="Abilities"></div>
      </section>
    </main>
  </body>
</html>
