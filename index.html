<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Browser Games</title>
    <meta name="description" content="A collection of browser games hosted with GitHub Pages.">
    <meta name="theme-color" content="#151a18">
    <meta name="apple-mobile-web-app-title" content="Browser Games">
    <link rel="manifest" href="assets/favicon/site.webmanifest">
    <link rel="icon" href="assets/favicon/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="assets/favicon/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png" sizes="180x180">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <p class="eyebrow">Browser games</p>
      <h1>Small games for quiet breaks.</h1>
      <p class="lede">A minimal launcher for games that run directly in your browser.</p>
    </header>

    <main class="page-shell">
      <section aria-labelledby="games-heading" class="games-section">
        <div class="section-heading">
          <h2 id="games-heading">Games</h2>
          <p id="games-status" class="status">Loading games...</p>
        </div>
        <div id="games-grid" class="games-grid" aria-live="polite"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>Static games, published from GitHub Actions.</p>
    </footer>

    <script type="module" src="app.js"></script>
  </body>
</html>
